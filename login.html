<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Triangle Utility Usage Dashboard</title>
<style>
:root{
  --bg:#EAEEF1; --panel:#FFFFFF; --ink:#17222E; --muted:#5E6B78;
  --line:#D8DFE6; --brand:#2FA24C; --brand-d:#1E7D39;
  --alert:#C0392B; --alertbg:#FBE9E7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--panel);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,32,45,.06),0 12px 32px rgba(16,32,45,.10);border:1px solid var(--line)}
.accent{height:5px;background:var(--brand)}
.inner{padding:28px 28px 30px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.brand b{font-size:19px;letter-spacing:.02em;font-weight:750}
.sub{margin:4px 0 24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:650}
label{display:block;font-size:12.5px;font-weight:650;margin-bottom:7px}
input[type=password]{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);
  border-radius:8px;padding:11px 13px;background:var(--panel);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,162,76,.18)}
.err{display:none;margin-top:10px;font-size:12.5px;color:var(--alert);background:var(--alertbg);
  border-radius:7px;padding:8px 11px}
.err.show{display:block}
button{margin-top:18px;width:100%;appearance:none;border:1px solid var(--brand);background:var(--brand);
  color:#fff;border-radius:8px;padding:11px 14px;font:inherit;font-size:14.5px;font-weight:650;cursor:pointer}
button:hover{background:var(--brand-d);border-color:var(--brand-d)}
button:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div class="card">
  <div class="accent"></div>
  <div class="inner">
    <div class="brand">
      <svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><polygon points="0,0 16,10 0,20" fill="#2FA24C"/></svg>
      <b>TRIANGLE</b>
    </div>
    <div class="sub">Investment Group · Utility Usage Dashboard</div>
    <form id="loginForm" autocomplete="off">
      <label for="passcode">Passcode</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" autofocus required>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="submitBtn">Enter</button>
    </form>
  </div>
</div>
<script>
const form=document.getElementById('loginForm');
const input=document.getElementById('passcode');
const err=document.getElementById('err');
const btn=document.getElementById('submitBtn');
function showErr(msg){err.textContent=msg;err.classList.add('show');}
function hideErr(){err.classList.remove('show');}
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  hideErr();
  const passcode=input.value.trim();
  if(!passcode){showErr('Enter a passcode.');return;}
  btn.disabled=true;btn.textContent='Checking…';
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({passcode})
    });
    const data=await r.json().catch(()=>({}));
    if(r.ok && data.ok){
      const params=new URLSearchParams(location.search);
      const dest=params.get('from');
      location.href=(dest && dest.startsWith('/'))?dest:'/';
    }else{
      showErr((data&&data.error)||'Incorrect passcode.');
      input.value='';
      input.focus();
    }
  }catch(e){
    showErr('Something went wrong. Please try again.');
  }finally{
    btn.disabled=false;btn.textContent='Enter';
  }
});
</script>
</body>
</html>
